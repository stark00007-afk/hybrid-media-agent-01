
name: DIPLOX Gemini Creative Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gemini-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile intelligence/creative_director.py
          python -m py_compile test_creative_director.py

      - name: Run Gemini Creative Director Test
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python test_creative_director.py
