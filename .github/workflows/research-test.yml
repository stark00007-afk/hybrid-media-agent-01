
name: DIPLOX First Launch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  first-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Get DIPLOX source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install research dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install feedparser

      - name: Launch research engine
        run: python research_engine.py
