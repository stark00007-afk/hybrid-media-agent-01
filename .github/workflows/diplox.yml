
name: DIPLOX Auto Launch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diplox:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Connect repository
        uses: actions/checkout@v4

      - name: Start Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: |
          pip install feedparser

      - name: Launch DIPLOX Research
        run: |
          python research_engine.py
