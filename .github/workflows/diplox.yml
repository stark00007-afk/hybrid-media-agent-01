
name: HMA-01 Pipeline Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hma-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Get HMA-01 code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run HMA-01
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

